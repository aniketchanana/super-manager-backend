version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: super-manager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    networks:
      - super-manager-network

  # Node.js application service
  app:
    build: .
    container_name: super-manager-backend
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@mongodb:27017/${MONGODB_DATABASE}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    depends_on:
      - mongodb
    networks:
      - super-manager-network
    volumes:
      # Optional: Mount for development
      - .:/app
      - /app/node_modules

  # Frontend application service
  frontend:
    image: super-manager-frontend:latest
    container_name: super-manager-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      VITE_BACKEND_API_URL: http://localhost:${PORT}
      PORT: ${FRONTEND_PORT}
    depends_on:
      - app
    networks:
      - super-manager-network
    volumes:
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  super-manager-network:
    driver: bridge 